name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: skill-hub-production
  cancel-in-progress: false

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export the verified image for deployment
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          docker pull "$image"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$GITHUB_SHA"
          archive="skill-hub-image-${GITHUB_SHA}.tar.gz"
          docker save "$image" | gzip -1 > "$archive"
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload the deployment image
        uses: actions/upload-artifact@v4
        with:
          name: skill-hub-image-${{ github.sha }}
          path: |
            skill-hub-image-${{ github.sha }}.tar.gz
            skill-hub-image-${{ github.sha }}.tar.gz.sha256
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the deployment image
        uses: actions/download-artifact@v4
        with:
          name: skill-hub-image-${{ github.sha }}

      - name: Transfer and activate the verified image with bounded SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: bash scripts/deploy-over-ssh.sh "$GITHUB_SHA"
