name: Deploy to Development

on:
  push:
    branches:
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SKILL_HUB_PORT: 8081
  COMPOSE_PROJECT_NAME: skill-hub-dev

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.dev.yml via SCP to Remote Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.dev.yml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Execute SSH Commands to Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 10m
          command_timeout: 10m
          script: |
            set -e  # Exit immediately if a command exits with a non-zero status.

            # Log into GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Navigate to deployment directory
            cd ${{ secrets.DEPLOY_PATH }}

            export GITHUB_REPOSITORY="${{ env.IMAGE_NAME }}"
            export IMAGE_TAG="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
            export SKILL_HUB_PORT="${{ env.SKILL_HUB_PORT }}"
            export COMPOSE_PROJECT_NAME="${{ env.COMPOSE_PROJECT_NAME }}"

            # Pull the image built from this commit with timeout
            timeout 5m docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} || echo "Pull timeout warning - continuing deployment"

            # Recreate development containers with the new image
            docker compose -p "${COMPOSE_PROJECT_NAME}" -f docker-compose.dev.yml down || true

            # Pull and start with explicit timeout
            timeout 8m env GITHUB_REPOSITORY=${GITHUB_REPOSITORY} IMAGE_TAG=${IMAGE_TAG} SKILL_HUB_PORT=${SKILL_HUB_PORT} docker compose -p "${COMPOSE_PROJECT_NAME}" -f docker-compose.dev.yml pull || echo "Compose pull timeout warning"
            timeout 5m env GITHUB_REPOSITORY=${GITHUB_REPOSITORY} IMAGE_TAG=${IMAGE_TAG} SKILL_HUB_PORT=${SKILL_HUB_PORT} docker compose -p "${COMPOSE_PROJECT_NAME}" -f docker-compose.dev.yml up -d

            # Clean up old dangling images to save disk space
            docker image prune -af
