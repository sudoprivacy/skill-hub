services:
  skill-hub-dev:
    image: ghcr.io/${GITHUB_REPOSITORY:-sudoprivacy/skill-hub}:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: skill-hub-dev
    restart: unless-stopped
    ports:
      - "${SKILL_HUB_PORT:-8081}:8080"
    environment:
      - SKILL_HUB_HOST=0.0.0.0
      - SKILL_HUB_PORT=8080
      - SKILL_HUB_DEBUG=false
      - SKILL_HUB_DATABASE_URL=${SKILL_HUB_DATABASE_URL}
      - SKILL_HUB_AUTH_TOKEN=${SKILL_HUB_AUTH_TOKEN}
      - SKILL_HUB_ADMIN_USERNAME=${SKILL_HUB_ADMIN_USERNAME:-admin}
      - SKILL_HUB_ADMIN_PASSWORD=${SKILL_HUB_ADMIN_PASSWORD}
      - SKILL_HUB_DATA_DIR=${SKILL_HUB_DATA_DIR:-/app/data}
      - SKILL_HUB_LOG_LEVEL=${SKILL_HUB_LOG_LEVEL:-INFO}
      - SKILL_HUB_API_PREFIX=${SKILL_HUB_API_PREFIX:-/api}
      - SKILL_HUB_COS_SECRET_ID=${SKILL_HUB_COS_SECRET_ID}
      - SKILL_HUB_COS_SECRET_KEY=${SKILL_HUB_COS_SECRET_KEY}
      - SKILL_HUB_COS_REGION=${SKILL_HUB_COS_REGION:-ap-beijing}
      - SKILL_HUB_COS_BASE_URL=https://sudowork-hub-1309794936.cos.ap-beijing.myqcloud.com
    volumes:
      - skill-hub-dev-data:/app/data

volumes:
  skill-hub-dev-data:
